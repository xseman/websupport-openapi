                dbName:
                    type: string
                    description: Database name
                dbUser:
                    type: string
                    description: Database user
                dbPassword:
                    type: string
                    format: password
                    description: Password, required when creating a new user; do not send when assigning an existing user
                dbType:
                    $ref: "#/components/schemas/DatabaseType"
                defaultCollation:
                    type: string
                    description: Default character encoding
                    example: utf8_general_ci
                note:
                    type: string
                    description: Your note
        DatabaseUpdate:
            type: object
            properties:
                dbPassword:
                    type: string
                    format: password
                    description: Password
                note:
                    type: string
                    description: Note
        DatabaseResult:
            type: object
            properties:
                status:
                    $ref: "#/components/schemas/Status"
                item:
                    $ref: "#/components/schemas/Database"
                errors:
                    $ref: "#/components/schemas/ValidationErrors"
        DatabaseUser:
            type: object
            properties:
                id:
                    type: integer
                dbUser:
                    type: string
                domain:
                    type: string
                dbType:
                    type: string
                    description: Database engine, e.g. `mariadb105` (see `DatabaseType` for the documented values)
        DatabaseUserList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/DatabaseUser"
                domains:
                    type: array
                    items:
                        type: string
                pager:
                    $ref: "#/components/schemas/Pager"
        DbCpuStat:
            type: object
            properties:
                timestamp:
                    type: integer
                access_denied:
                    type: integer
                binlog_bytes_written:
                    type: integer
                busy_time:
                    type: number
                bytes_received:
                    type: integer
                bytes_sent:
                    type: integer
                commit_transactions:
                    type: integer
                concurrent_connections:
                    type: integer
                connected_time:
                    type: number
                cpu_time:
                    type: number
                denied_connections:
                    type: integer
                empty_queries:
                    type: integer
                lost_connections:
                    type: integer
                other_commands:
                    type: integer
                rollback_transactions:
                    type: integer
                rows_fetched:
                    type: integer
                rows_updated:
                    type: integer
                select_commands:
                    type: integer
                table_rows_read:
                    type: integer
                total_connections:
                    type: integer
                update_commands:
                    type: integer
        DbCpuHistory:
            type: object
            properties:
                items:
