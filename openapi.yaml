                      mailBox:
                          type: string
                          description: Mailbox name (local part)
                      deleted:
                          type: boolean
                      disabled:
                          type: boolean
                - $ref: "#/components/schemas/MailboxFields"
        MailboxList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Mailbox"
                pager:
                    $ref: "#/components/schemas/Pager"
                domains:
                    type: array
                    items:
                        type: string
        MailboxCreate:
            type: object
