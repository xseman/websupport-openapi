                "404":
                    $ref: "#/components/responses/NotFound"
        post:
            operationId: createZoneRecord
            summary: Create a new record
            description: |
                **[DEPRECATED]** Use the v2 API [Create a new record](https://rest.websupport.sk/v2/docs#/DNS/rest.v2.dns.create-record) instead.

                Supported record types are `A`, `AAAA`, `MX`, `ANAME`, `CNAME`, `NS`, `TXT` and `SRV`.
                All changes are immediately reflected to the Websupport DNS servers, but records can be
                cached for a few minutes in your computer or in other DNS servers.
            deprecated: true
            tags:
                - DNS service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/DomainName"
                - $ref: "#/components/parameters/DateHeader"
