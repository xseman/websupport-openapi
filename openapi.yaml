                    description: Enable access only from selected IP addresses
                ips:
                    type: array
                    description: IPs for `ipCheck` in the format `1.2.3.0/24` or `1.2.3.4`
                    items:
                        type: string
                countryCheck:
                    type: boolean
                    default: true
                    description: Enable access only from selected countries
                countries:
                    type: array
                    default: [SK, CZ, HU, AT]
                    description: Countries for `countryCheck` as 2-letter identifiers, e.g. `SK`, `CZ`
                    items:
                        type: string
                imapDisabled:
                    type: boolean
                    default: false
                    description: Disable IMAP
                pop3Disabled:
                    type: boolean
                    default: false
                    description: Disable POP3
                note:
                    type: string
                    description: Your note
        MailboxUpdate:
