                $ref: "#/components/schemas/ShellConsole"
        Vhost:
            type: object
            description: Webhosting domain (vhost)
            properties:
                id:
                    type: integer
                domain:
                    type: string
                sub:
                    type: string
                webOnStorage:
                    type: string
                subOnStorage:
                    type: string
                logsOnStorage:
                    type: string
                disabled:
                    type: boolean
                keepAliveOff:
                    type: boolean
                phpOpenBaseDir:
                    type: boolean
                phpOpenBaseDirStorage:
                    type: boolean
                phpOpenBaseDirAll:
                    type: boolean
                phpOpenBaseWebInWeb:
                    type: boolean
                nonExistSubDomainsToWeb:
