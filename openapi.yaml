                phpPostMaxSize:
                    type: integer
                    description: PHP `post_max_size` (unit not documented, presumably MB)
                phpMaxExecutionTime:
                    type: integer
                    description: PHP `max_execution_time` (unit not documented, presumably seconds)
        VhostList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Vhost"
                pager:
                    $ref: "#/components/schemas/Pager"
        UsageStats:
            type: object
            properties:
                hosting:
                    type: string
                    description: Hosting name
                used:
                    type: number
                free:
                    type: number
                available:
                    type: number
        DatabaseType:
            type: string
            enum:
                - mariadb105
                - mariadb103
                - mysql80
                - mysql57
                - postgresql100
        Database:
            type: object
            properties:
                id:
                    type: integer
                    nullable: true
                    description: Database ID. `null` in the create response (on success as well as on validation error); populated in detail, list, update and delete responses.
                dbName:
                    type: string
                dbUser:
                    type: string
                dbType:
                    type: string
                    description: Database engine, e.g. `mariadb105` (see `DatabaseType` for the documented values)
                deleted:
                    type: boolean
                disabled:
                    type: boolean
                domain:
                    type: string
                note:
                    type: string
        DatabaseList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Database"
                pager:
                    $ref: "#/components/schemas/Pager"
                domains:
                    type: array
                    description: Domains of the hosting
                    items:
                        type: string
        DatabaseCreate:
            type: object
            required:
                - domain
                - dbName
                - dbUser
                - dbType
