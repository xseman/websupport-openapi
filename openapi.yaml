            responses:
                "201":
                    description: Record created
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DnsRecordResult"
                "400":
                    description: Validation error (`status` is `error`, `errors` holds messages per field)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DnsRecordResult"
                "404":
                    $ref: "#/components/responses/NotFound"
    /user/{userId}/zone/{domainName}/record/{recordId}:
        get:
