                - $ref: "#/components/parameters/SnapshotName"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "204":
                    description: Restore started
        delete:
            operationId: deleteVpsSnapshot
            summary: Delete VPS snapshot
            description: |
                Deletes the VPS snapshot.

                The documentation's request example omits the `/snapshot` path segment; the curl example
                (`.../vps/:id-or-name/snapshot/:snapshot-name`) is used here.
            tags:
                - VPS service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/VpsIdOrName"
                - $ref: "#/components/parameters/SnapshotName"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "204":
                    description: Snapshot deleted

components:
    securitySchemes:
        basicAuth:
            type: http
            scheme: basic
            description: |
                See the [documentation](https://rest.websupport.sk/docs/v1.intro).

                - **username**: API key
                - **password**: request signature, a hex-encoded HMAC-SHA1 hash of the canonical request
                  `{HTTP method} {complete request path} {unix timestamp}`, where the path includes the query string
                  if any (e.g. `GET /v1/some/url?attributes=123&some=aaa 1548240417`),
                  calculated with the API secret. The same timestamp must be sent in the `Date` header.

                API key and secret can be generated in the Websupport admin.

    parameters:
        DateHeader:
            name: Date
            in: header
            required: true
            description: |
                Time used for the request signature, in the ISO 8601 basic format in the GMT timezone
                (e.g. `20230101T000000Z`). The documentation's Python and PowerShell examples send the extended
                format (`2023-01-01T00:00:00Z`) instead.
            schema:
                type: string
            example: 20230101T000000Z
        DateHeaderOptional:
            name: Date
            in: header
            required: false
            description: |
                Time used for the request signature, in the ISO 8601 basic format in the GMT timezone
                (e.g. `20230101T000000Z`). Required together with authentication when creating a subuser
                (`isSubUser` set to `true`).
            schema:
                type: string
            example: 20230101T000000Z
        AcceptLanguage:
            name: Accept-Language
            in: header
            required: false
            description: Language of validation messages.
            schema:
                type: string
                enum:
                    - en_us
                    - sk
                    - cs_cz
                    - hu
        Page:
            name: page
            in: query
            required: false
            description: Page number.
            schema:
                type: integer
        PageSize:
            name: pagesize
            in: query
            required: false
            description: Number of items per page. Default page size is unlimited.
            schema:
                type: integer
        DryRun:
            name: dryRun
            in: query
            required: false
            description: Set to `1` to run validation only; the response format is the same and the status code is `200` instead of `201`.
            schema:
                type: integer
                enum:
                    - 1
        StatsIntervalDayHour:
            name: interval
            in: query
            required: false
            description: Time interval of one measurement.
            schema:
                type: string
                enum:
                    - day
                    - hour
        StatsIntervalDayHourMinute:
            name: interval
            in: query
            required: false
            description: Time interval of one measurement.
            schema:
                type: string
                enum:
                    - day
                    - hour
                    - minute
        StatsLength:
            name: length
            in: query
            required: false
            description: Number of shown measurements (time period depends on the chosen interval).
            schema:
                type: integer
        UserId:
            name: userId
            in: path
            required: true
            description: User ID, or `self` for the currently logged user.
            schema:
                type: string
            example: self
        BillingId:
            name: billingId
            in: path
            required: true
            description: Billing profile ID.
            schema:
                type: integer
        DomainProfileId:
            name: domainProfileId
            in: path
            required: true
            description: Domain profile ID.
            schema:
                type: string
        ServiceId:
            name: serviceId
            in: path
            required: true
            description: Service ID.
            schema:
                type: integer
        InvoiceId:
            name: invoiceId
            in: path
            required: true
            description: Invoice ID.
            schema:
                type: integer
        OrderId:
            name: orderId
            in: path
            required: true
            description: Order ID.
            schema:
                type: integer
        PaymentCardId:
            name: paymentCardId
            in: path
            required: true
            description: Payment card ID.
            schema:
                type: integer
        Market:
            name: market
            in: path
            required: true
            description: 2-letter market identifier.
            schema:
                type: string
                enum:
                    - sk
                    - cz
                    - hu
                    - at
        OrderType:
            name: type
            in: path
            required: true
            description: Service type, e.g. `domain`, `credit`, `vps`.
            schema:
                type: string
        DomainName:
            name: domainName
            in: path
            required: true
            description: Zone domain name, e.g. `scaledo.com`.
            schema:
                type: string
        RecordId:
            name: recordId
            in: path
            required: true
            description: DNS record ID.
            schema:
                type: integer
        IdOrUuid:
            name: idOrUuid
            in: path
            required: true
            description: Hosting service ID or UUID.
            schema:
                type: string
        HostingId:
            name: hostingId
            in: path
            required: true
            description: Hosting ID.
            schema:
                type: integer
        VhostId:
            name: vhostId
            in: path
            required: true
            description: Webhosting domain (vhost) ID.
            schema:
                type: integer
        DbId:
            name: dbId
            in: path
            required: true
            description: Database ID.
            schema:
                type: integer
        MailboxId:
            name: mailboxId
            in: path
            required: true
            description: Mailbox ID.
            schema:
                type: integer
        DomainId:
            name: domainId
            in: path
            required: true
            description: Hosting domain ID (`domainId` of a mailbox).
            schema:
                type: integer
        MailDomain:
            name: domain
            in: path
            required: true
            description: Domain name.
            schema:
                type: string
        ShellDomain:
            name: domain
            in: path
            required: true
            description: Domain name of the shell console.
            schema:
                type: string
        FtpAccountId:
            name: ftpAccountId
            in: path
            required: true
            description: FTP account ID.
            schema:
                type: integer
        VpsIdOrName:
            name: vpsIdOrName
            in: path
            required: true
            description: VPS ID or name.
            schema:
                type: string
        SnapshotName:
            name: snapshotName
            in: path
            required: true
            description: Snapshot name.
            schema:
                type: string

    responses:
        NotFound:
            description: Not found
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        InternalServerError:
            description: Internal server error
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"

    schemas:
        # ---------------------------------------------------------------
        # Common
        # ---------------------------------------------------------------
        Error:
            type: object
            description: Error response used for all `4xx` and `5xx` statuses.
            properties:
                code:
                    type: integer
                    description: HTTP status code
                    example: 404
                message:
                    type: string
                    description: Error message
                    example: User not found.
        Status:
            type: string
            description: Result of a create/update/delete operation
            enum:
                - success
                - error
        ValidationErrors:
            description: |
                Validation errors keyed by field name. On success the API returns an empty object (`{}`)
                or an empty array (`[]`).
            oneOf:
                - type: object
                  additionalProperties:
                      type: array
                      items:
                          type: string
                - type: array
                  maxItems: 0
                  items:
                      type: string
        Pager:
            type: object
            description: Pagination information
            properties:
                page:
                    type: integer
                    description: Current page number
                pagesize:
                    type: integer
                    nullable: true
                    description: Number of items per page (`null` when unlimited)
                items:
                    type: integer
                    description: Number of items in the current page
        Range:
            type: array
            description: Start and end unix timestamps of the returned measurements
            minItems: 2
            maxItems: 2
            items:
                type: integer
            example: [1428332843, 1431011242]
        SizeHistoryItem:
            type: object
            properties:
                size:
                    type: integer
                    description: Size at the measured time
                timestamp:
                    type: integer
                    description: Unix timestamp of the measurement
        SizeHistory:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/SizeHistoryItem"
                range:
                    $ref: "#/components/schemas/Range"
        Market:
            type: object
            properties:
                name:
                    type: string
                    description: Market name
                    example: Slovensko
                identifier:
                    type: string
                    description: 2-letter market identifier
                    enum:
                        - sk
                        - cz
                        - hu
                        - at
                currency:
                    type: string
                    description: Market currency
                    example: EUR
        PaymentUrls:
            type: object
            description: |
                Payment page URLs per payment system. Append `?mobile=1` to a URL to get the mobile version
                of the internet banking / credit card payment page.
            properties:
                tbtatrapay:
                    type: string
                    format: uri
                    description: TatraPay internet banking
                tbcardpay:
                    type: string
                    format: uri
                    description: CardPay credit card payment (card is not stored)
                vubeplatby:
                    type: string
                    format: uri
                    description: VUB ePayments internet banking
                comfortpay:
                    type: string
                    format: uri
                    description: ComfortPay recurring payment system (card is stored for later use)
        PaymentStatus:
            type: object
            properties:
                status:
                    type: boolean
                    description: Whether the payment was successful

        # ---------------------------------------------------------------
        # User service
        # ---------------------------------------------------------------
        UserGroup:
            type: string
            description: User group
            enum:
                - users
                - subadmins
        UserListItem:
            type: object
            properties:
                id:
                    type: integer
                    description: User ID
                login:
                    type: string
                    description: Login
                parentId:
                    type: integer
                    nullable: true
                    description: Parent user ID (`null` for top-level users)
                active:
                    type: boolean
                    description: Whether the user is active
                createTime:
                    type: integer
                    description: Unix timestamp of creation
                group:
                    $ref: "#/components/schemas/UserGroup"
        UserList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/UserListItem"
                pager:
                    $ref: "#/components/schemas/Pager"
        UserDetail:
            allOf:
                - $ref: "#/components/schemas/UserListItem"
                - type: object
                  properties:
                      email:
                          type: string
                          description: E-mail address(es), multiple addresses separated by comma
                      phone:
                          type: string
                          description: Phone number used for SMS notifications
                      sknicHandle:
                          type: string
                          description: SK-NIC handle
                      contactPerson:
                          type: string
                          description: Contact person in your company
                      resellerToken:
                          type: string
                          description: Reseller token
                      credit:
                          type: number
                          description: Available credit
                      verifyUrl:
                          type: string
                          format: uri
                          description: Account verification URL
                      billing:
                          type: array
                          description: Billing profiles of the user
                          items:
                              $ref: "#/components/schemas/BillingProfile"
                      market:
                          $ref: "#/components/schemas/Market"
        UserCreate:
            type: object
            description: The documentation's example request omits `phone` and `confirmTerms`, but its parameter table marks them as required.
            required:
                - login
                - password
                - email
                - name
                - city
                - street
                - zip
                - country
                - phone
                - confirmTerms
            properties:
                market:
                    type: string
                    description: 2-letter market identifier
                    default: sk
                    enum:
                        - sk
                        - cz
                        - hu
                        - at
                isSubUser:
                    type: boolean
                    description: If `true`, the user is added as your subuser and you can manage his settings, services etc. Requires authentication!
                login:
                    type: string
                    description: Login
                password:
                    type: string
                    format: password
                    description: Plain password
                email:
                    type: string
                    description: E-mail address(es), multiple addresses separated by comma (`,`)
                name:
                    type: string
                    description: Company name or your full name
                city:
                    type: string
                    description: City
                street:
                    type: string
                    description: Street + number
                zip:
                    type: string
                    description: Area ZIP code
                country:
                    type: string
                    description: Two-letter country identifier (ISO 3166-1 alpha-2), e.g. `SK`
                phone:
                    type: string
                    description: Phone number used for SMS notifications etc.
                confirmTerms:
                    type: boolean
                    description: Confirm Terms and Conditions
                contactPerson:
                    type: string
                    description: Contact person in your company
                companyRegId:
                    type: string
                    description: Company registration ID (IČO in Slovakia or Czech Republic)
                taxId:
                    type: string
                    description: Tax ID (DIČ in Slovakia or Czech Republic)
                vatId:
                    type: string
                    description: Value-added Tax (VAT) ID (IČ-DPH in Slovakia or Czech Republic)
                isic:
                    type: string
                    description: ISIC student identification card number, only for the `sk` market
        UserCreated:
            type: object
            description: User as returned after creation
            properties:
                id:
                    type: integer
                    nullable: true
                    description: User ID (`null` when validation failed)
                billingId:
                    type: integer
                    nullable: true
                    description: ID of the created default billing profile
                market:
                    type: string
                    description: Market identifier
                group:
                    $ref: "#/components/schemas/UserGroup"
                parentId:
                    type: integer
                    nullable: true
                login:
                    type: string
                email:
                    type: string
                password:
                    type: string
                name:
                    type: string
                city:
                    type: string
                street:
                    type: string
                zip:
                    type: string
                country:
                    type: string
                companyRegId:
                    type: string
                taxId:
                    type: string
                vatId:
                    type: string
                contactPerson:
                    type: string
                phone:
                    type: string
                isic:
                    type: string
        UserCreateResult:
            type: object
            properties:
                status:
                    $ref: "#/components/schemas/Status"
                item:
                    $ref: "#/components/schemas/UserCreated"
                errors:
                    $ref: "#/components/schemas/ValidationErrors"
        UserUpdate:
            type: object
            properties:
                password:
                    type: string
                    format: password
                    description: Plain password
                email:
                    type: string
                    description: E-mail address(es), multiple addresses separated by comma (`,`)
                phone:
                    type: string
                    description: Phone number used for SMS notifications etc.
                contactPerson:
                    type: string
                    description: Contact person in your company
                userLanguage:
                    type: string
                    description: Language used to send notifications
                    enum:
                        - sk
                        - cs
                        - hu
                        - de
                        - en
                        - sv
        UserUpdated:
            type: object
            properties:
                id:
                    type: integer
                login:
                    type: string
                email:
                    type: string
                password:
                    type: string
                phone:
                    type: string
                contactPerson:
                    type: string
        UserUpdateResult:
            type: object
            properties:
                status:
                    $ref: "#/components/schemas/Status"
                item:
                    $ref: "#/components/schemas/UserUpdated"
                errors:
                    $ref: "#/components/schemas/ValidationErrors"
        PasswordResetRequest:
            type: object
            required:
                - login
            properties:
                login:
                    type: string
                    description: Login of the account to reset
        PasswordResetResult:
            type: object
            properties:
                status:
                    $ref: "#/components/schemas/Status"
                errors:
                    $ref: "#/components/schemas/ValidationErrors"
        BillingProfileFields:
            type: object
            properties:
                profile:
                    type: string
                    description: Billing profile name. Not used in any invoice, only for your information.
                isDefault:
                    type: boolean
                    description: Whether this is the primary billing profile
                name:
                    type: string
                    description: Company name or your full name
                city:
                    type: string
                    description: City
                street:
                    type: string
                    description: Street + number
                zip:
                    type: string
                    description: Area ZIP code
                country:
                    type: string
                    description: Two-letter country identifier (ISO 3166-1 alpha-2), e.g. `sk`
                companyRegId:
                    type: string
                    description: Company registration ID (IČO in Slovakia or Czech Republic)
                taxId:
                    type: string
                    description: Tax ID (DIČ in Slovakia or Czech Republic)
                vatId:
                    type: string
                    description: Value-added Tax (VAT) ID (IČ-DPH in Slovakia or Czech Republic)
                isic:
                    type: string
                    description: ISIC student identification card number, only in Slovakia
        BillingProfile:
            allOf:
                - type: object
                  properties:
                      id:
                          type: integer
                          nullable: true
                          description: Billing profile ID (`null` when validation failed)
                - $ref: "#/components/schemas/BillingProfileFields"
        BillingProfileCreate:
            allOf:
                - $ref: "#/components/schemas/BillingProfileFields"
                - type: object
                  required:
                      - profile
                      - name
                      - city
                      - street
                      - zip
                      - country
                  properties:
                      isDefault:
                          type: boolean
                          default: false
                          description: Set to `true` to make this profile the primary billing profile
        BillingProfileUpdate:
            $ref: "#/components/schemas/BillingProfileFields"
        BillingProfileList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/BillingProfile"
                pager:
                    $ref: "#/components/schemas/Pager"
        BillingProfileResult:
            type: object
            properties:
                status:
                    $ref: "#/components/schemas/Status"
                item:
                    $ref: "#/components/schemas/BillingProfile"
                errors:
                    $ref: "#/components/schemas/ValidationErrors"
        DomainProfileFields:
            type: object
            properties:
                firstName:
                    type: string
                    description: First name
                lastName:
                    type: string
                    description: Last name
                orgName:
                    type: string
                    nullable: true
                    description: Company name; if submitted, a corporate domain profile is created
                street:
                    type: string
                    description: Street + house number
                city:
                    type: string
                    description: City
                zip:
                    type: string
                    description: Postcode
                country:
                    type: string
                    description: Two-letter country identifier (ISO 3166-1 alpha-2), e.g. `SK`
                email:
                    type: string
                    description: Valid e-mail address (used to authorize any subsequent change to the assigned domain profile)
                phone:
                    type: string
                    description: Phone number in the form `+421900123456`
                identCompanyRegistration:
                    type: string
                    nullable: true
                    description: Company registration ID (IČO in Slovakia or Czech Republic), required for company-registered .sk domains
                identVat:
                    type: string
                    nullable: true
                    description: Value-added Tax (VAT) ID (IČ-DPH in Slovakia or Czech Republic)
                identIdentityCard:
                    type: string
                    nullable: true
                    description: Personal ID card number, required for registration of some TLDs
                identBirthday:
                    type: string
                    nullable: true
                    description: Birthdate (`yyyy-M-d`), required for registration of some TLDs
                identPassport:
                    type: string
                    nullable: true
                    description: Passport number, required for registration of some TLDs
        DomainProfile:
            allOf:
                - type: object
                  properties:
                      id:
                          type: string
                          nullable: true
                          description: Domain profile ID (returned as a string; `null` when validation failed)
                - $ref: "#/components/schemas/DomainProfileFields"
        DomainProfileDetail:
            allOf:
                - $ref: "#/components/schemas/DomainProfile"
                - type: object
                  properties:
                      domains:
                          type: array
                          description: Domains assigned to the profile (element shape not documented)
                          items: {}
                      pendingDomains:
                          type: array
                          description: Domains with a pending assignment (element shape not documented)
                          items: {}
                      changeRequest:
                          type: array
                          description: Pending change requests (element shape not documented)
                          items: {}
        DomainProfileCreate:
            allOf:
                - $ref: "#/components/schemas/DomainProfileFields"
                - type: object
                  required:
                      - firstName
                      - lastName
                      - street
                      - city
                      - zip
                      - country
                      - email
                      - phone
        DomainProfileUpdate:
            $ref: "#/components/schemas/DomainProfileFields"
        DomainProfileList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/DomainProfile"
                pager:
                    $ref: "#/components/schemas/Pager"
        DomainProfileResult:
            type: object
            properties:
                status:
                    $ref: "#/components/schemas/Status"
                item:
                    $ref: "#/components/schemas/DomainProfile"
                errors:
                    $ref: "#/components/schemas/ValidationErrors"

        # ---------------------------------------------------------------
        # Service management
        # ---------------------------------------------------------------
        Service:
            type: object
            properties:
                id:
                    type: integer
                    description: Service ID
                serviceName:
                    type: string
                    description: Service type name, e.g. `.sk doména`, `The Hosting`
                status:
                    type: string
                    description: Service status, e.g. `active`
                name:
                    type: string
                    description: Service name, e.g. domain name or hosting name
                createTime:
                    type: integer
                    description: Unix timestamp of creation
                expireTime:
                    type: integer
                    description: Unix timestamp of expiration
                price:
                    type: number
                    description: Service price
                autoExtend:
                    type: boolean
                    description: Automatically pay the service from credits before expiration
        ServiceList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Service"
                pager:
                    $ref: "#/components/schemas/Pager"
        ServiceUpdate:
            type: object
            properties:
                autoExtend:
                    type: boolean
                    description: Automatically pay the service from credits before expiration
        ServiceResult:
            type: object
            properties:
                status:
                    $ref: "#/components/schemas/Status"
                item:
                    $ref: "#/components/schemas/Service"
                errors:
                    $ref: "#/components/schemas/ValidationErrors"

        # ---------------------------------------------------------------
        # Invoice service
        # ---------------------------------------------------------------
        InvoiceItem:
            type: object
            properties:
                serviceName:
                    type: string
                    description: Service type, e.g. `domain`, `thehosting`
                name:
                    type: string
                    description: Service name
                price:
                    type: number
                    description: Price without VAT
                priceWithVat:
                    type: number
                    description: Price with VAT
                startTime:
                    type: integer
                    nullable: true
                    description: Unix timestamp of the service period start (`null` for e.g. setup fees)
                endTime:
                    type: integer
                    nullable: true
                    description: Unix timestamp of the service period end (`null` for e.g. setup fees)
        InvoiceBilling:
            type: object
            properties:
                name:
                    type: string
                city:
                    type: string
                street:
                    type: string
                zip:
                    type: string
                country:
                    type: string
                companyRegId:
                    type: string
                taxId:
                    type: string
                vatId:
                    type: string
        Invoice:
            type: object
            properties:
                id:
                    type: integer
                    description: Invoice ID
                type:
                    type: string
                    description: Only `invoice` is a real commercial invoice; the other types are informative
                    enum:
                        - invoice
                        - proforma
                        - payed-by-credit
                number:
                    type: string
                    description: Invoice number
                variable:
                    type: string
                    description: Variable symbol
                createTime:
                    type: integer
                    description: Unix timestamp of creation
                dateOfPerformance:
                    type: integer
                    description: Unix timestamp of the date of performance
                dueDate:
                    type: integer
                    description: Unix timestamp of the due date
                price:
                    type: number
                    description: Price without VAT
                priceWithVat:
                    type: number
                    description: Price with VAT
                vatPercent:
                    type: number
                    description: VAT percentage
                currency:
                    type: string
                    description: Currency code, e.g. `eur`
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/InvoiceItem"
                billing:
                    $ref: "#/components/schemas/InvoiceBilling"
                market:
                    type: object
                    properties:
                        name:
                            type: string
                        identifier:
                            type: string
        InvoiceList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Invoice"
                pager:
                    $ref: "#/components/schemas/Pager"
        InvoicePdf:
            type: object
            properties:
                id:
                    type: string
                    description: Invoice ID
                pdf:
                    type: string
                    format: byte
                    description: Base64 encoded PDF file

        # ---------------------------------------------------------------
        # Ordering service
        # ---------------------------------------------------------------
        MarketPrice:
            type: object
            description: |
                Price entry of a service. The identifying properties depend on the service type:
                domains use `tld`, VPS plans use `ram`, `disk` and `vcpus`.
            properties:
                tld:
                    type: string
                    description: Domain TLD (domain services)
                ram:
                    type: integer
                    description: RAM size in MB (VPS services)
                disk:
                    type: integer
                    description: Disk size in GB (VPS services)
                vcpus:
                    type: integer
                    description: Number of virtual CPUs (VPS services)
                price:
                    type: number
                    description: Price without VAT
                priceWithVat:
                    type: number
                    description: Price with VAT
            additionalProperties: true
        MarketTemplate:
            type: object
            description: VPS operating system template
            properties:
                name:
                    type: string
                    example: Ubuntu 22.04
                version:
                    type: string
                    nullable: true
        MarketService:
            type: object
            properties:
                type:
                    type: string
                    description: Service type, e.g. `domain`, `credit`, `vps`
                prices:
                    type: array
                    items:
                        $ref: "#/components/schemas/MarketPrice"
                discounts:
                    type: array
                    items:
                        $ref: "#/components/schemas/MarketPrice"
                currency:
                    type: string
                    description: Currency code, e.g. `eur`
                templates:
                    type: array
                    description: Available templates (VPS services only)
                    items:
                        $ref: "#/components/schemas/MarketTemplate"
        DomainOrderItem:
            type: object
            required:
                - domain
            properties:
                domain:
                    type: string
                    description: The full domain name with TLD, e.g. `scaledo.com`
                    example: testingdomain.sk
                dnsServers:
                    type: string
                    description: List of DNS servers separated by semicolon (`;`), e.g. `ns1.websupport.sk;ns2.websupport.sk` (supported for `sk`, `cz`, `eu`)
                domainProfileId:
                    type: integer
                    description: ID of the domain profile
                contactId:
                    type: string
                    description: Custom contact ID
        CreditOrderItem:
            type: object
            required:
                - amount
            properties:
                amount:
                    type: integer
                    description: Amount to order; 1 credit is 1 EUR, HUF or CZK (depending on market)
                    example: 20
        VpsOrderItem:
            type: object
            required:
                - name
                - ram
                - disk
                - vcpus
                - templateName
                - templateVersion
            properties:
                name:
                    type: string
                    description: VPS hostname, only alphanumeric characters
                ram:
                    type: integer
                    description: RAM size in MB
                disk:
                    type: integer
                    description: HDD size in GB
                vcpus:
                    type: integer
                    description: Number of virtual CPUs
                templateName:
                    type: string
                    description: Template name, see "Service details"
                templateVersion:
                    type: string
                    description: Template version
                period:
                    type: integer
                    minimum: 1
                    maximum: 12
                    default: 1
                    description: Service billing period in months
                secondaryIp:
                    type: boolean
                    default: false
                backups:
                    type: boolean
                    default: true
        OrderServiceItem:
            description: |
                Service to validate or order. The `type` property selects the service type and the remaining
                properties are the same as for the single-service validation methods. Responses may contain
                service types that are not documented as request types.
            oneOf:
                - $ref: "#/components/schemas/DomainOrderServiceItem"
                - $ref: "#/components/schemas/CreditOrderServiceItem"
                - $ref: "#/components/schemas/VpsOrderServiceItem"
            discriminator:
                propertyName: type
                mapping:
                    domain: "#/components/schemas/DomainOrderServiceItem"
                    credit: "#/components/schemas/CreditOrderServiceItem"
                    vps: "#/components/schemas/VpsOrderServiceItem"
        DomainOrderServiceItem:
            allOf:
                - type: object
                  required:
                      - type
                  properties:
                      type:
                          type: string
                          enum:
                              - domain
                - $ref: "#/components/schemas/DomainOrderItem"
        CreditOrderServiceItem:
            allOf:
                - type: object
                  required:
                      - type
                  properties:
                      type:
                          type: string
                          enum:
                              - credit
                - $ref: "#/components/schemas/CreditOrderItem"
        VpsOrderServiceItem:
            allOf:
                - type: object
                  required:
                      - type
                  properties:
                      type:
                          type: string
                          enum:
                              - vps
                - $ref: "#/components/schemas/VpsOrderItem"
        ValidationPricing:
            type: object
            description: Price information returned by validation; values may be `null` when validation failed
            properties:
                price:
                    type: number
                    nullable: true
                    description: Price without VAT
                priceWithVat:
                    type: number
                    nullable: true
                    description: Price with VAT
                currency:
                    type: string
                    nullable: true
                    description: Currency code, e.g. `eur`
                period:
                    type: integer
                    nullable: true
                    description: Billing period
                periodLength:
                    type: string
                    nullable: true
                    description: Billing period unit, e.g. `year`, `month`
        DomainValidation:
            allOf:
                - type: object
                  properties:
                      domain:
                          type: string
                      suggest:
                          type: boolean
                      dnsServers:
                          type: string
                      contactId:
                          type: string
                      domainProfileId:
                          type: integer
                      sknicHandle:
                          type: string
                - $ref: "#/components/schemas/ValidationPricing"
        DomainValidationResult:
            type: object
            properties:
                status:
                    $ref: "#/components/schemas/Status"
                item:
                    $ref: "#/components/schemas/DomainValidation"
                errors:
                    $ref: "#/components/schemas/ValidationErrors"
        CreditValidation:
            allOf:
                - type: object
                  properties:
                      amount:
                          type: integer
                - $ref: "#/components/schemas/ValidationPricing"
        CreditValidationResult:
            type: object
            properties:
                status:
                    $ref: "#/components/schemas/Status"
                item:
                    $ref: "#/components/schemas/CreditValidation"
                errors:
                    $ref: "#/components/schemas/ValidationErrors"
        PriceDetail:
            type: object
            properties:
                prices:
                    type: object
                    description: Price per component without VAT (e.g. `vps`, `backups`, `secondaryIp`)
                    additionalProperties:
                        type: number
                pricesWithVat:
                    type: object
                    description: Price per component with VAT
                    additionalProperties:
                        type: number
        VpsValidation:
            allOf:
                - type: object
                  properties:
                      name:
                          type: string
                      ram:
                          type: integer
                      disk:
                          type: integer
                      vcpus:
                          type: integer
                          nullable: true
                      templateName:
                          type: string
                      templateVersion:
                          type: string
                      backups:
                          type: boolean
                      secondaryIp:
                          type: boolean
                - $ref: "#/components/schemas/ValidationPricing"
                - type: object
                  properties:
                      priceDetail:
                          $ref: "#/components/schemas/PriceDetail"
        VpsValidationResult:
            type: object
            properties:
                status:
                    $ref: "#/components/schemas/Status"
                item:
                    $ref: "#/components/schemas/VpsValidation"
                errors:
                    $ref: "#/components/schemas/ValidationErrors"
        OrderedServiceValidation:
            allOf:
                - $ref: "#/components/schemas/ValidationPricing"
                - type: object
                  description: Validated service; the remaining properties depend on the service type
                  additionalProperties: true
        OrderedServiceValidationResult:
            type: object
            properties:
                status:
                    $ref: "#/components/schemas/Status"
                item:
                    $ref: "#/components/schemas/OrderedServiceValidation"
                errors:
                    $ref: "#/components/schemas/ValidationErrors"
        OrderCreate:
            type: object
            required:
                - services
            properties:
                services:
                    type: array
                    description: List of services to order
                    items:
                        $ref: "#/components/schemas/OrderServiceItem"
                note:
                    type: string
                    description: Additional information for the helpdesk team (orders with a note are confirmed manually)
        Order:
            type: object
            properties:
                id:
                    type: integer
                    nullable: true
                    description: Order ID (`null` when validation failed or on dry run)
                services:
                    type: array
                    items:
                        $ref: "#/components/schemas/OrderedServiceValidationResult"
                note:
                    type: string
        OrderResult:
            type: object
            properties:
                status:
                    $ref: "#/components/schemas/Status"
                item:
                    $ref: "#/components/schemas/Order"
                errors:
                    $ref: "#/components/schemas/ValidationErrors"
        PaymentCard:
            type: object
            properties:
                id:
                    type: integer
                    description: Payment card ID
                name:
                    type: string
                    description: Masked card number
                    example: 4461********1234
                defaultBillingId:
                    type: integer
                    description: Default billing profile ID of the card
                createTime:
                    type: integer
                    description: Unix timestamp of creation
        PaymentCardList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/PaymentCard"
                credit:
                    type: number
                    description: Available credit

        # ---------------------------------------------------------------
        # DNS service
        # ---------------------------------------------------------------
        ZoneListItem:
            type: object
            properties:
                id:
                    type: integer
                    description: Zone ID
                name:
                    type: string
                    description: Zone (domain) name
        Zone:
            allOf:
                - $ref: "#/components/schemas/ZoneListItem"
                - type: object
                  properties:
                      updateTime:
                          type: integer
                          description: Unix timestamp of the last update
        ZoneList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/ZoneListItem"
                pager:
                    $ref: "#/components/schemas/Pager"
        DnsRecordType:
            type: string
            enum:
                - A
                - AAAA
                - MX
                - ANAME
                - CNAME
                - NS
                - TXT
                - SRV
        DnsRecord:
            type: object
            properties:
                id:
                    type: integer
                    nullable: true
                    description: Record ID (`null` when validation failed)
                type:
                    $ref: "#/components/schemas/DnsRecordType"
                name:
                    type: string
                    description: Subdomain name, or `@` for the zone itself
                content:
                    type: string
                    description: Record content
                ttl:
                    type: integer
                    description: Time to live in seconds
                prio:
                    type: integer
                    nullable: true
                    description: Priority (MX, SRV)
                weight:
                    type: integer
                    nullable: true
                    description: Weight (SRV)
                port:
                    type: integer
                    nullable: true
                    description: Port (SRV)
        DnsRecordDetail:
            allOf:
                - $ref: "#/components/schemas/DnsRecord"
                - type: object
                  properties:
                      zone:
                          $ref: "#/components/schemas/Zone"
        DnsRecordList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/DnsRecord"
                pager:
                    $ref: "#/components/schemas/Pager"
        DnsRecordResult:
            type: object
            properties:
                status:
                    $ref: "#/components/schemas/Status"
                item:
                    $ref: "#/components/schemas/DnsRecordDetail"
                errors:
                    $ref: "#/components/schemas/ValidationErrors"
        DnsRecordCreate:
            description: New DNS record; the required properties depend on the record `type`.
            oneOf:
                - $ref: "#/components/schemas/RecordA"
                - $ref: "#/components/schemas/RecordAAAA"
                - $ref: "#/components/schemas/RecordMX"
                - $ref: "#/components/schemas/RecordANAME"
                - $ref: "#/components/schemas/RecordCNAME"
                - $ref: "#/components/schemas/RecordNS"
                - $ref: "#/components/schemas/RecordTXT"
                - $ref: "#/components/schemas/RecordSRV"
            discriminator:
                propertyName: type
                mapping:
                    A: "#/components/schemas/RecordA"
                    AAAA: "#/components/schemas/RecordAAAA"
                    MX: "#/components/schemas/RecordMX"
                    ANAME: "#/components/schemas/RecordANAME"
                    CNAME: "#/components/schemas/RecordCNAME"
                    NS: "#/components/schemas/RecordNS"
                    TXT: "#/components/schemas/RecordTXT"
                    SRV: "#/components/schemas/RecordSRV"
        RecordA:
            type: object
            required:
                - type
                - name
                - content
            properties:
                type:
                    type: string
                    enum:
                        - A
                name:
                    type: string
                    description: Subdomain name, or `@` if you don't want a subdomain
                content:
                    type: string
                    format: ipv4
                    description: IPv4 address in dotted decimal format, e.g. `1.2.3.4`
                ttl:
                    type: integer
                    default: 600
                    description: Time to live in seconds
        RecordAAAA:
            type: object
            required:
                - type
                - name
                - content
            properties:
                type:
                    type: string
                    enum:
                        - AAAA
                name:
                    type: string
                    description: Subdomain name, or `@` if you don't want a subdomain
                content:
                    type: string
                    format: ipv6
                    description: IPv6 address, e.g. `2001:db8::3`
                ttl:
                    type: integer
                    default: 600
                    description: Time to live in seconds
        RecordMX:
            type: object
            required:
                - type
                - name
                - content
                - prio
            properties:
                type:
                    type: string
                    enum:
                        - MX
                name:
                    type: string
                    description: Subdomain name, or `@` if you don't want a subdomain
                content:
                    type: string
                    description: Domain name of the mail server, e.g. `mail1.scaledo.com`
                prio:
                    type: integer
                    description: Record priority
                ttl:
                    type: integer
                    default: 600
                    description: Time to live in seconds
        RecordANAME:
            type: object
            required:
                - type
                - name
                - content
            properties:
                type:
                    type: string
                    enum:
                        - ANAME
                name:
                    type: string
                    description: "`@` or empty string"
                content:
                    type: string
                    description: The canonical hostname, e.g. `something.scaledo.com`
                ttl:
                    type: integer
                    default: 600
                    description: Time to live in seconds
        RecordCNAME:
            type: object
            required:
                - type
                - name
                - content
            properties:
                type:
                    type: string
                    enum:
                        - CNAME
                name:
                    type: string
                    description: Subdomain name
                content:
                    type: string
                    description: The canonical hostname, e.g. `something.scaledo.com`
                ttl:
                    type: integer
                    default: 600
                    description: Time to live in seconds
        RecordNS:
            type: object
            required:
                - type
                - name
                - content
            properties:
                type:
                    type: string
                    enum:
                        - NS
                name:
                    type: string
                    description: Subdomain name, or `@` if you don't want a subdomain
                content:
                    type: string
                    description: The canonical hostname of the DNS server, e.g. `ns1.scaledo.com`
                ttl:
                    type: integer
                    default: 600
                    description: Time to live in seconds
        RecordTXT:
            type: object
            required:
                - type
                - name
                - content
            properties:
                type:
                    type: string
                    enum:
                        - TXT
                name:
                    type: string
                    description: Subdomain name, or `@` if you don't want a subdomain
                content:
                    type: string
                    description: Text used for DKIM or other purposes
                ttl:
                    type: integer
                    default: 600
                    description: Time to live in seconds
        RecordSRV:
            type: object
            description: SRV record. The documentation table lists the type value as `TXT`, which is a typo; the value is `SRV`.
            required:
                - type
                - name
                - content
                - prio
                - port
                - weight
            properties:
                type:
                    type: string
                    enum:
                        - SRV
                name:
                    type: string
                    description: Subdomain name, or `@` if you don't want a subdomain
                content:
                    type: string
                    description: The canonical hostname of the machine providing the service
                prio:
                    type: integer
                    description: Record priority
                port:
                    type: integer
                    description: The TCP or UDP port on which the service is to be found
                weight:
                    type: integer
                    description: A relative weight for records with the same priority
                ttl:
                    type: integer
                    default: 600
                    description: Time to live in seconds
        DnsRecordUpdate:
            type: object
            description: All parameters are optional; `type` cannot be changed.
            properties:
                name:
                    type: string
                    description: Subdomain name, or `@` if you don't want a subdomain
                content:
                    type: string
                    description: Record content
                ttl:
                    type: integer
                    description: Time to live in seconds
                prio:
                    type: integer
                    description: Record priority (MX, SRV)
                port:
                    type: integer
                    description: Port (SRV)
                weight:
                    type: integer
                    description: Weight (SRV)

        # ---------------------------------------------------------------
        # Hosting service
        # ---------------------------------------------------------------
        Hosting:
            type: object
            properties:
                id:
                    type: integer
                    description: Hosting (service) ID
                name:
                    type: string
                    description: Hosting name
                uuid:
                    type: string
                    format: uuid
                    description: Hosting UUID
        HostingList:
            type: object
            properties:
                items:
                    type: array
