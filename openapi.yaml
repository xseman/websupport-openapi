openapi: 3.0.3

info:
    title: Websupport API
    version: 1.0.0
    description: |
        Purpose of this API is to enable to manage services provided by Websupport.

        This specification is hand-written from the [official documentation](https://rest.websupport.sk/docs/index),
        which is not published in OpenAPI format. The documentation is the source of truth; where the
        documentation contains an obvious typo, the corrected value is used here and noted in the description.

        ## Authentication

        HTTP Basic authentication where the username is the API key and the password is a request
        signature that changes with every request. The signature is a hex-encoded HMAC-SHA1 hash of the
        canonical request `{HTTP method} {complete request path} {unix timestamp}`, where the path includes
        the query string if any (e.g. `GET /v1/some/url?attributes=123&some=aaa 1548240417`), calculated with the API secret.

        Every authenticated request must also send a `Date` header with the time used for the signature
        (ISO 8601 basic format in GMT, e.g. `20230101T000000Z`).

        ## Request and response format

        JSON in both directions (`Content-Type: application/json`, `Accept: application/json`), UTF-8.

        Error responses (`4xx`, `5xx`) use the format `{"code": 400, "message": "..."}`.
        Create/update operations return an envelope `{"status": "success" | "error", "item": {...}, "errors": {...}}`;
        validation failures are reported with HTTP `200` and `"status": "error"` unless stated otherwise.

        ## Language

        Validation messages can be localised with the `Accept-Language` header (`en_us`, `sk`, `cs_cz`, `hu`).
    contact:
        email: helpdesk@websupport.sk
    license:
        name: Apache-2.0
        url: https://www.apache.org/licenses/LICENSE-2.0

externalDocs:
    description: Official Websupport REST API documentation
    url: https://rest.websupport.sk/docs/index

servers:
    - url: https://rest.websupport.sk/v1

security:
    - basicAuth: []

tags:
    - name: User service
      description: User accounts, billing profiles and domain profiles.
      externalDocs:
          url: https://rest.websupport.sk/docs/v1.user
    - name: Service management
      description: Services owned by a user.
      externalDocs:
          url: https://rest.websupport.sk/docs/v1.service
    - name: Invoice service
      description: Invoices and invoice payments.
      externalDocs:
          url: https://rest.websupport.sk/docs/v1.invoice
    - name: Ordering service
      description: Available services, order validation, ordering and payments.
      externalDocs:
          url: https://rest.websupport.sk/docs/v1.order
    - name: DNS service
      description: DNS zones and records.
      externalDocs:
          url: https://rest.websupport.sk/docs/v1.zone
    - name: Hosting service
      description: Web hosting, databases, mailboxes, FTP accounts and shell consoles.
      externalDocs:
          url: https://rest.websupport.sk/docs/v1.hosting
    - name: VPS service
      description: Virtual private servers.
      externalDocs:
          url: https://rest.websupport.sk/docs/v1.vps

paths:
    # ------------------------------------------------------------------
    # User service
    # ------------------------------------------------------------------
    /user:
        get:
            operationId: listAllUsers
            summary: List of all users
            description: |
                Lists all users.

                - **User**: can order and manage all services under his account including subuser and subadmin accounts
                - **Subadmin**: can manage only services (web, DNS, mail, SQL) allowed by User

                Default page size is unlimited.
            tags:
                - User service
            parameters:
                - $ref: "#/components/parameters/Page"
                - $ref: "#/components/parameters/PageSize"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserList"
        post:
            operationId: createUser
            summary: Create a new user
            description: |
                Creates a new user account.

                This method is available without authentication, but if you want to create a subuser
                (`isSubUser` set to `true`) authentication (and the `Date` header) is required.
            tags:
                - User service
            security:
                - {}
                - basicAuth: []
            parameters:
                - $ref: "#/components/parameters/DateHeaderOptional"
                - $ref: "#/components/parameters/AcceptLanguage"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UserCreate"
            responses:
                "201":
                    description: User created
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserCreateResult"
                "200":
                    description: Validation error (`status` is `error`, `errors` holds messages per field)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserCreateResult"
    /user/restorepass:
        post:
            operationId: restoreUserPassword
            summary: Password reset
            description: Requests a password reset for the given login.
            tags:
                - User service
            parameters:
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/PasswordResetRequest"
            responses:
                "201":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PasswordResetResult"
                "200":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PasswordResetResult"
    /user/{userId}:
        get:
            operationId: getUserDetail
            summary: Get a user detail
            description: Returns the user detail by user ID, or of the currently logged user when `self` is used.
            tags:
                - User service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserDetail"
                "404":
                    $ref: "#/components/responses/NotFound"
        put:
            operationId: updateUser
            summary: Update user
            description: |
                Updates the user. If you change the password, use the new password in the next API request
                (the old one may keep working for up to a minute, but do not rely on it).

                Fields `name`, `city`, `street`, `zip`, `country`, `companyRegId`, `taxId`, `vatId` and `isic`
                can be modified only through the billing profile update.
            tags:
                - User service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UserUpdate"
            responses:
                "201":
                    description: User updated
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserUpdateResult"
                "200":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserUpdateResult"
                "404":
                    $ref: "#/components/responses/NotFound"
    /user/{userId}/billing:
        get:
            operationId: listAllBillingProfiles
            summary: List of all billing profiles
            description: Lists the billing profiles of the user. Default page size is unlimited.
            tags:
                - User service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/Page"
                - $ref: "#/components/parameters/PageSize"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BillingProfileList"
                "404":
                    $ref: "#/components/responses/NotFound"
        post:
            operationId: createBillingProfile
            summary: Create a new billing profile
            tags:
                - User service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/BillingProfileCreate"
            responses:
                "201":
                    description: Billing profile created
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BillingProfileResult"
                "200":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BillingProfileResult"
                "404":
                    $ref: "#/components/responses/NotFound"
    /user/{userId}/billing/{billingId}:
        get:
            operationId: getBillingProfileDetail
            summary: Get a billing profile detail
            tags:
                - User service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/BillingId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BillingProfile"
                "404":
                    $ref: "#/components/responses/NotFound"
        put:
            operationId: updateBillingProfile
            summary: Update billing profile
            tags:
                - User service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/BillingId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/BillingProfileUpdate"
            responses:
                "201":
                    description: Billing profile updated
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BillingProfileResult"
                "200":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BillingProfileResult"
                "404":
                    $ref: "#/components/responses/NotFound"
        delete:
            operationId: deleteBillingProfile
            summary: Delete billing profile
            description: Deletes the billing profile. Deleting the **default** profile is blocked.
            tags:
                - User service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/BillingId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Billing profile deleted
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BillingProfileResult"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    description: Cannot delete default profile
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /user/{userId}/domainProfile:
        get:
            operationId: listAllDomainProfiles
            summary: List of all domain profiles
            description: |
                Domain profiles allow you to manage contact information on your domains.
                Default page size is unlimited.
            tags:
                - User service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/Page"
                - $ref: "#/components/parameters/PageSize"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DomainProfileList"
        post:
            operationId: createDomainProfile
            summary: Create new domain profile
            tags:
                - User service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/DomainProfileCreate"
            responses:
                "201":
                    description: Domain profile created
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DomainProfileResult"
                "200":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DomainProfileResult"
    /user/{userId}/domainProfile/{domainProfileId}:
        get:
            operationId: getDomainProfileDetail
            summary: Get a domain profile
            tags:
                - User service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/DomainProfileId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DomainProfileDetail"
                "404":
                    $ref: "#/components/responses/NotFound"
        put:
            operationId: updateDomainProfile
            summary: Update domain profile
            description: |
                Any of the create parameters can be sent. It is not possible to switch between company and
                personal profiles or change identifiers (company reg. no, birthdate, etc.) once the profile
                is assigned to a domain.
            tags:
                - User service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/DomainProfileId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/DomainProfileUpdate"
            responses:
                "200":
                    description: Domain profile updated (`status` is `success`) or validation error (`status` is `error`)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DomainProfileResult"
                "404":
                    $ref: "#/components/responses/NotFound"
        delete:
            operationId: deleteDomainProfile
            summary: Delete domain profile
            description: Deletes the domain profile. A profile that is assigned to a domain cannot be deleted.
            tags:
                - User service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/DomainProfileId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Domain profile deleted
                "400":
                    description: Profile does not exist, or profile has assigned domains
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"

    # ------------------------------------------------------------------
    # Service management
    # ------------------------------------------------------------------
    /user/{userId}/service:
        get:
            operationId: listAllServices
            summary: List of all services
            tags:
                - Service management
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/Page"
                - $ref: "#/components/parameters/PageSize"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ServiceList"
    /user/{userId}/service/{serviceId}:
        get:
            operationId: getServiceDetail
            summary: Get a service detail
            tags:
                - Service management
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/ServiceId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Service"
        put:
            operationId: updateService
            summary: Update service
            tags:
                - Service management
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/ServiceId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ServiceUpdate"
            responses:
                "201":
                    description: Service updated
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ServiceResult"
                "200":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ServiceResult"

    # ------------------------------------------------------------------
    # Invoice service
    # ------------------------------------------------------------------
    /user/{userId}/invoice:
        get:
            operationId: listAllInvoices
            summary: List of all invoices
            description: |
                There are 3 types of invoices: `invoice`, `proforma` and `payed-by-credit`. Only the type
                `invoice` is a real commercial invoice (in terms of taxation and accounting), the other types
                are only informative.

                Some services (e.g. setup fee) don't have `startTime` and `endTime`, so these fields are `null`.
                Default page size is unlimited.
            tags:
                - Invoice service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/Page"
                - $ref: "#/components/parameters/PageSize"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/InvoiceList"
                "404":
                    $ref: "#/components/responses/NotFound"
    /user/{userId}/invoice/{invoiceId}:
        get:
            operationId: getInvoiceDetail
            summary: Get an invoice detail
            tags:
                - Invoice service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/InvoiceId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Invoice"
    /user/{userId}/invoice/by-order/{orderId}:
        get:
            operationId: getInvoiceByOrder
            summary: Get an unpaid invoice by order ID
            description: |
                If you don't know the invoice ID, you can get **unpaid** invoices by **order ID**.
                The response shape is not documented; it is assumed to be the same as the invoice detail.
            tags:
                - Invoice service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/OrderId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Invoice"
    /user/{userId}/invoice/{invoiceId}/pdf:
        get:
            operationId: getInvoicePdf
            summary: Get an invoice PDF
            description: Returns the invoice as a base64 encoded PDF file.
            tags:
                - Invoice service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/InvoiceId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/InvoicePdf"
    /user/{userId}/invoice/{invoiceId}/raw-pdf:
        get:
            operationId: getInvoiceRawPdf
            summary: Get an invoice PDF as RAW data
            description: Returns the PDF file as binary data, **not JSON**. Response headers are modified too.
            tags:
                - Invoice service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/InvoiceId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Binary PDF data
                    content:
                        application/pdf:
                            schema:
                                type: string
                                format: binary
    /user/{userId}/invoice/{invoiceId}/pay:
        get:
            operationId: payInvoice
            summary: Pay it
            description: |
                Returns payment URLs for paying the invoice with a **credit card** or **internet banking**
                (TatraPay, VUB ePayments, ComfortPay recurring payment system, Visa or MasterCard).

                **Note:** if you choose the ComfortPay payment system, the payment card is stored so it can be
                used next time through "Pay with a stored card". If you don't want to store the card, use
                CardPay (`tbcardpay`).
            tags:
                - Invoice service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/InvoiceId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PaymentUrls"
                "404":
                    description: Invoice not found, not confirmed or already paid
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /user/{userId}/invoice/{invoiceId}/pay/byPaymentCard/{paymentCardId}:
        put:
            operationId: payInvoiceByPaymentCard
            summary: Pay with a stored card
            description: Pays the invoice with a payment card assigned to the account in the past (see "List of all payment cards").
            tags:
                - Invoice service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/InvoiceId"
                - $ref: "#/components/parameters/PaymentCardId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PaymentStatus"
                "404":
                    description: Invoice not found, not confirmed or already paid
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /user/{userId}/invoice/{invoiceId}/pay/byCredit:
        put:
            operationId: payInvoiceByCredit
            summary: Pay with credit
            tags:
                - Invoice service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/InvoiceId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PaymentStatus"
                "404":
                    description: Invoice not found, not confirmed or already paid
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"

    # ------------------------------------------------------------------
    # Ordering service
    # ------------------------------------------------------------------
    /order/{market}:
        get:
            operationId: listAvailableMarketServices
            summary: List of available services
            description: |
                Every item has its type and a list of prices. The price is identified by an identifier/plan
                name (string), for example domain TLD. Currency is based on the `market` identifier.
            tags:
                - Ordering service
            security: []
            parameters:
                - $ref: "#/components/parameters/Market"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/MarketService"
                "404":
                    description: Unknown market
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /order/{market}/{type}:
        get:
            operationId: getMarketServiceDetail
            summary: Service details
            tags:
                - Ordering service
            security: []
            parameters:
                - $ref: "#/components/parameters/Market"
                - $ref: "#/components/parameters/OrderType"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MarketService"
                "404":
                    description: Unknown order type
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /order/{market}/validate/domain:
        post:
            operationId: validateOrderMarketDomain
            summary: Validate a domain
            description: |
                Validates order attributes for a domain. The same attributes are used for real ordering.
                Can be used as a domain name validator, for checking domain availability and for getting
                service prices.
            tags:
                - Ordering service
            security: []
            parameters:
                - $ref: "#/components/parameters/Market"
                - $ref: "#/components/parameters/AcceptLanguage"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/DomainOrderItem"
            responses:
                "200":
                    description: Validation result (`status` is `success` or `error`)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DomainValidationResult"
                "500":
                    $ref: "#/components/responses/InternalServerError"
    /order/{market}/validate/credit:
        post:
            operationId: validateOrderMarketCredit
            summary: Validate credit
            description: Validates order attributes for credit. The same attributes are used for real ordering.
            tags:
                - Ordering service
            security: []
            parameters:
                - $ref: "#/components/parameters/Market"
                - $ref: "#/components/parameters/AcceptLanguage"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreditOrderItem"
            responses:
                "200":
                    description: Validation result (`status` is `success` or `error`)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CreditValidationResult"
    /order/{market}/validate/vps:
        post:
            operationId: validateOrderMarketVps
            summary: Validate VPS
            description: Validates order attributes for a VPS. The same attributes are used for real ordering.
            tags:
                - Ordering service
            security: []
            parameters:
                - $ref: "#/components/parameters/Market"
                - $ref: "#/components/parameters/AcceptLanguage"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/VpsOrderItem"
            responses:
                "200":
                    description: Validation result (`status` is `success` or `error`)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/VpsValidationResult"
    /order/{market}/validate:
        post:
            operationId: validateOrderMarket
            summary: Validating multiple services
            description: |
                Identical to validating each service separately, except that the request body is a **list**
                of service attributes and each item carries a `type` property identifying the service type.
                The response is a **list** of validation results; each service is validated separately, there
                is no common status code.
            tags:
                - Ordering service
            security: []
            parameters:
                - $ref: "#/components/parameters/Market"
                - $ref: "#/components/parameters/AcceptLanguage"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: "#/components/schemas/OrderServiceItem"
            responses:
                "200":
                    description: One validation result per submitted service
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/OrderedServiceValidationResult"
    /user/{userId}/order:
        post:
            operationId: createUserOrder
            summary: Ordering services
            description: |
                Creates an order for the given services. Service items use the same attributes as the
                validation methods plus a `type` property.

                Add `?dryRun=1` to run the validation only; the response format is the same but the status
                code is `200` instead of `201`.
            tags:
                - Ordering service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/DryRun"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/OrderCreate"
            responses:
                "201":
                    description: Order created
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OrderResult"
                "200":
                    description: Validation error, input format error, or dry run
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OrderResult"
                "500":
                    $ref: "#/components/responses/InternalServerError"
    /user/{userId}/billing/{billingId}/order:
        post:
            operationId: createUserOrderWithBilling
            summary: Ordering services with custom billing profile
            description: Same as "Ordering services", but the order uses the given billing profile.
            tags:
                - Ordering service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/BillingId"
