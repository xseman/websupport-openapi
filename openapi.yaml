                        application/json:
                            schema:
                                $ref: "#/components/schemas/OrderResult"
                "200":
                    description: Validation error, input format error, or dry run
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OrderResult"
                "500":
                    $ref: "#/components/responses/InternalServerError"
    /user/{userId}/order/{orderId}/pay:
        get:
            operationId: payUserOrder
            summary: Pay it
            description: |
                Returns payment URLs for paying the order with a **credit card** or **internet banking**.

                Payment URLs are available a few seconds after creating the order (usually up to 5 s), but
                orders that need manual confirmation (e.g. containing a note) can take hours. If you don't
                get a response after 60 s, ignore this method and wait for an e-mail with the attached invoice.

                **Note:** if you choose the ComfortPay payment system, the payment card is stored so it can be
                used next time through "Pay with a stored card". If you don't want to store the card, use
                CardPay (`tbcardpay`).
            tags:
                - Ordering service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/OrderId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PaymentUrls"
                "404":
                    description: Order not found, not confirmed or already paid
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /user/{userId}/order/{orderId}/pay/byPaymentCard/{paymentCardId}:
        put:
            operationId: payUserOrderByPaymentCard
            summary: Pay with a stored card
            description: |
                Pays the order with a payment card assigned to the account in the past.

                Payment is available a few minutes after creating the order (usually up to 5 min); orders that
                need manual confirmation can take hours. If you don't get a response after 60 s, ignore this
                method and wait for an e-mail with the attached invoice.
            tags:
                - Ordering service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/OrderId"
                - $ref: "#/components/parameters/PaymentCardId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PaymentStatus"
                "404":
                    description: Order not found, not confirmed or already paid
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /user/{userId}/order/{orderId}/pay/byCredit:
        put:
            operationId: payUserOrderByCredit
            summary: Pay with credit
            tags:
                - Ordering service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/OrderId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PaymentStatus"
                "404":
                    description: Order not found, not confirmed or already paid
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /user/{userId}/paymentcard:
        get:
            operationId: listAllPaymentCards
            summary: List of all payment cards
            description: |
                Lists all payment cards of the user. To add a new payment card, pay your first invoice/order
                with the **ComfortPay** system; the card is then added to the account automatically.
            tags:
                - Ordering service
            parameters:
