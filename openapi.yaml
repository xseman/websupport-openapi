                port:
                    type: integer
                    description: Web console port
                url:
                    type: string
                    format: uri
                    description: Web console URL
                premium:
                    type: boolean
                status:
                    type: string
                    description: Console status, e.g. `active`
                create_time:
                    type: integer
                    description: Unix timestamp of creation
