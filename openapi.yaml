                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DnsRecordDetail"
                "404":
                    $ref: "#/components/responses/NotFound"
        put:
            operationId: updateZoneRecord
            summary: Update a record
            description: |
                **[DEPRECATED]** Use the v2 API [Update a record](https://rest.websupport.sk/v2/docs#/DNS/rest.v2.dns.update-record) instead.

                The field `type` is **not allowed** here; the record type cannot be changed. All parameters
                are optional. All changes are immediately reflected to the Websupport DNS servers, but records
                can be cached for a few minutes in your computer or in other DNS servers.
            deprecated: true
            tags:
                - DNS service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/DomainName"
                - $ref: "#/components/parameters/RecordId"
                - $ref: "#/components/parameters/DateHeader"
                - $ref: "#/components/parameters/AcceptLanguage"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/DnsRecordUpdate"
            responses:
                "200":
                    description: Record updated
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DnsRecordResult"
                "400":
                    description: Validation error (`status` is `error`, `errors` holds messages per field)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DnsRecordResult"
                "404":
                    $ref: "#/components/responses/NotFound"
        delete:
            operationId: deleteZoneRecord
            summary: Delete a record
            description: |
                **[DEPRECATED]** Use the v2 API [Delete a record](https://rest.websupport.sk/v2/docs#/DNS/rest.v2.dns.delete-record) instead.

                All changes are immediately reflected to the Websupport DNS servers, but records can be
                cached for a few minutes in your computer or in other DNS servers.
            deprecated: true
            tags:
