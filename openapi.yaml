            responses:
                "201":
                    description: Snapshot is being created
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Snapshot"
                "403":
                    description: Snapshot limit exceeded
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /user/{userId}/vps/{vpsIdOrName}/snapshot/{snapshotName}:
        post:
            operationId: restoreVpsSnapshot
            summary: Restore VPS from a snapshot
            description: |
                Rolls back the VPS to the state of the given snapshot.

                The documentation's request example omits the `/snapshot` path segment; the curl example
                (`.../vps/:id-or-name/snapshot/:snapshot-name`) is used here.
            tags:
                - VPS service
            parameters:
