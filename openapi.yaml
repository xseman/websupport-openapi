                    items:
                        type: string
                countryCheck:
                    type: boolean
                    description: Enable access only from selected countries
                countries:
                    type: array
                    description: Countries for `countryCheck` as 2-letter identifiers, e.g. `SK`, `CZ`
                    items:
                        type: string
                imapDisabled:
                    type: boolean
                    description: Disable IMAP
                pop3Disabled:
                    type: boolean
                    description: Disable POP3
                note:
                    type: string
                    description: Your note
        Mailbox:
            allOf:
                - type: object
                  properties:
                      id:
                          type: integer
                          nullable: true
                          description: Mailbox ID (`null` when validation failed)
                      domain:
                          type: string
                      domainId:
                          type: integer
                      email:
                          type: string
