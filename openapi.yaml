            operationId: createVpsSnapshot
            summary: Create VPS snapshot
            description: |
                Saves the current state of the VPS into a snapshot. It is recommended to shut off the server
                before snapshotting, otherwise the consistency of the snapshot cannot be guaranteed, which may
                lead to problems when restoring the server from the snapshot.
            tags:
                - VPS service
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/VpsIdOrName"
                - $ref: "#/components/parameters/DateHeader"
